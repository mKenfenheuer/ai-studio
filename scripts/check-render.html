                path: "/data/backups/2026-09-08_02-00-00" }],
    settings: { dir: "/data/backups", every_hours: 24, keep: 7, include_models: false },

window.fetch = async (url) => {
  const u = String(url);
  const hit = FIXTURES.find(([re]) => re.test(u));
  const body = hit ? hit[1] : {};
  return { ok: true, status: 200, json: async () => body, text: async () => JSON.stringify(body) };
};
// The event stream must not actually open.
window.WebSocket = class { constructor() { this.readyState = 0; } send() {} close() {} addEventListener() {} };

const results = [];
const errors = [];
window.addEventListener("error", (e) => errors.push("window error: " + e.message));
window.addEventListener("unhandledrejection", (e) => errors.push("unhandled: " + (e.reason?.stack || e.reason?.message || e.reason)));

const VIEWS = [
  ["dashboard", "./views/dashboard.js", "dashboardView", []],
  ["data", "./views/data.js", "dataView", []],
  ["dataset", "./views/dataset.js", "datasetView", ["ds_1"]],
  ["jobs", "./views/jobs.js", "jobsView", []],
  ["job", "./views/job.js", "jobView", ["job_1"]],
  ["play-picker", "./views/play.js", "playView", []],
  ["play-chat", "./views/play.js", "playView", ["job_1"]],
  ["runners", "./views/runners.js", "runnersView", []],
  ["evals", "./views/evals.js", "evalsView", []],
  ["evalview", "./views/evalview.js", "evalView", ["ev_1"]],
  ["benchmark-result", "./views/evalview.js", "evalView", ["ev_2"]],
  ["compare", "./views/compare.js", "compareView", []],
  ["serving", "./views/serving.js", "servingView", []],
  ["vision", "./views/vision.js", "visionView", [], "#/new/vision?project=prj_1"],
  ["settings", "./views/settings.js", "settingsView", []],
  ["account", "./views/account.js", "accountView", []],
  // Once without a project, where it must ask; once with, where it must work.
  ["wizard-gate", "./views/wizard.js", "wizardView", [], "#/new"],
  ["wizard", "./views/wizard.js", "wizardView", [], "#/new?project=prj_1"],
  ["generate", "./views/generate.js", "generateView", [], "#/generate?project=prj_1"],
  ["sweep", "./views/sweep.js", "sweepView", ["sw_1"]],
  ["sweeps", "./views/sweep.js", "sweepsView", []],
  ["rerun", "./views/rerun.js", "rerunView", ["job_1"]],
  ["users", "./views/users.js", "usersView", []],
  ["sso", "./views/sso.js", "ssoView", []],
  ["projects", "./views/projects.js", "projectsView", []],
  ["project", "./views/projects.js", "projectView", ["prj_1"]],
  ["unfiled", "./views/projects.js", "projectView", ["unfiled"]],
  ["models", "./views/models.js", "modelsView", []],
  ["admin", "./views/admin.js", "adminView", []],
  ["admin-storage", "./views/admin.js", "adminView", ["storage"]],
  ["admin-backups", "./views/admin.js", "adminView", ["backups"]],
  ["ops", "./views/ops.js", "opsView", []],
  ["chat", "./views/chat.js", "chatView", []],
];

const main = document.getElementById("main");
// ?only=jobs mounts one view and leaves it there, for screenshots.
const only = new URLSearchParams(location.search).get("only");
if (only) document.getElementById("results").hidden = true;
const RUN = only ? VIEWS.filter(([l]) => l === only) : VIEWS;
for (const [label, path, fn, args, hash] of RUN) {
  try {
    const mod = await import(`/static/js/${path.slice(2)}`);
    // Some pages read the address: the wizard, the generator and the vision
    // page all ask which project they are working in and stop if they are not
    // told, which is the point of them -- so the harness has to say.
    // replaceState, not `location.hash = ...`. Assigning the hash fires a
    // hashchange, and app.js -- which every view drags in for `session` --
    // listens for it and redraws #main with whatever route matches. That
    // render is async, so it lands a few milliseconds later, in the middle of
    // this scene, and replaces the view under test with the projects page.
    // It only bites when the previous scene left a different address behind
    // (the admin page rewrites its own), which is why it stayed hidden until
    // a new scene was added directly after that one.
    history.replaceState(null, "", hash || "#/");
    main.innerHTML = "";
    const stop = await mod[fn](main, args);
    // A view that draws nothing is a view that failed quietly, which is the
    // exact failure this is here to find.
    const drew = main.innerHTML.trim().length;
    const ribbons = main.querySelectorAll(".ribbon").length;
    // Click every tab. A ribbon whose tabs throw, or draw nothing, is worse
    // than no ribbon: the page looks fine until somebody presses the thing.
    let tabNote = "";
    const tabKeys = [...main.querySelectorAll("[data-tab]:not([disabled])")]
      .map((b) => b.dataset.tab);
    for (const key of (only ? [] : tabKeys)) {
      const btn = main.querySelector(`[data-tab="${key}"]`);
      if (!btn) { tabNote += ` !${key}-gone`; continue; }
      btn.click();
      await new Promise((r) => setTimeout(r, 30));
      const bodyLen = main.querySelector(".ribbon-body")?.innerHTML.trim().length || 0;
      const active = main.querySelector(`[data-tab="${key}"]`)?.getAttribute("aria-selected");
      if (bodyLen < 20) tabNote += ` !${key}-empty`;
      if (active !== "true") tabNote += ` !${key}-notselected`;
    }
    results.push(`${drew > 200 ? "ok  " : "THIN"} ${label.padEnd(12)} ${
      String(drew).padStart(6)} chars, ${tabKeys.length} tab(s)${
      tabNote || (ribbons ? " all switch" : "")}`);
    // ?tab=... opens one tab before the screenshot is taken.
    const wantTab = new URLSearchParams(location.search).get("tab");
    if (only && wantTab) {
      main.querySelector(`[data-tab="${wantTab}"]`)?.click();
      await new Promise((r) => setTimeout(r, 400));
    }
    // ?press=#someButton presses it, for the panels that only appear once
    // something has been asked for.
    const press = new URLSearchParams(location.search).get("press");
    if (only && press) {
      main.querySelector(press)?.click();
      await new Promise((r) => setTimeout(r, 600));
    }
    if (typeof stop === "function" && !only) stop();
  } catch (e) {
    results.push(`FAIL ${label.padEnd(12)} ${e.message}`);
    errors.push(`${label}: ${e.stack || e.message}`);
  }
}

// ---------------------------------------------------------------------------
// Behaviours worth asserting, rather than just "it drew something".
// ---------------------------------------------------------------------------
if (!only) {
  const say = (name, ok, detail = "") =>
    results.push(`${ok ? "ok  " : "FAIL"} ${name.padEnd(12)} ${detail}`);

  try {
    localStorage.removeItem("aistudio.wizard");
    const { wizardView } = await import("/static/js/views/wizard.js");
    location.hash = "#/new?project=prj_1";
    main.innerHTML = "";
    await wizardView(main, []);

    // Choosing from-scratch is a state change; it must survive a remount.
    main.querySelector('[data-mode="scratch"]')?.click();
    await new Promise((r) => setTimeout(r, 120));
    const saved = JSON.parse(localStorage.getItem("aistudio.wizard") || "null");
    say("draft saved", saved?.mode === "scratch", `mode=${saved?.mode}`);

    main.innerHTML = "";
    await wizardView(main, []);
    await new Promise((r) => setTimeout(r, 120));
    const back = main.querySelector('[data-mode="scratch"]');
    say("draft restored", back?.classList.contains("selected"),
        back ? back.className : "no mode button");

    // The step comes from the address, so Back and Forward move between steps.
    location.hash = "#/new?project=prj_1&step=1";
    main.innerHTML = "";
    await wizardView(main, []);
    await new Promise((r) => setTimeout(r, 120));
    const active = main.querySelector('[data-tab][aria-selected="true"]');
    say("step from url", active?.dataset.tab === "1",
        `landed on step ${active?.dataset.tab}`);

    // The format step must reach the formats. It asks for a preview of the
    // rows before offering any layout, and it used to leave the arranging of
    // that request to the data step -- which does not run when the step is
    // opened directly, which is every step change, because the step is in
    // the address. The page then waited on a request nobody had sent.
    localStorage.removeItem("aistudio.wizard");
    location.hash = "#/new?project=prj_1&step=3&dataset=ds_1";
    main.innerHTML = "";
    await wizardView(main, []);
    await new Promise((r) => setTimeout(r, 400));
    const text = main.textContent;
    const tiles = main.querySelectorAll("[data-tmpl]").length;
    say("format step draws", tiles > 0 && !text.includes("Reading a few real rows"),
        `${tiles} layout(s) offered`);
    localStorage.removeItem("aistudio.wizard");

    // The data step shows the project's own datasets, and folds the rest of
    // the library away: choosing between two relevant ones and choosing
    // between forty are different tasks.
    localStorage.removeItem("aistudio.wizard");
    location.hash = "#/new?project=prj_1&step=2";
    main.innerHTML = "";
    await wizardView(main, []);
    await new Promise((r) => setTimeout(r, 300));
    const heads = [...main.querySelectorAll("h3")].map((h) => h.textContent.trim());
    const folded = [...main.querySelectorAll("details summary")]
      .some((x) => /outside this project/i.test(x.textContent));
    say("library scoped", heads.includes("In this project") && folded,
        folded ? "the rest is folded away" : "no fold for the rest");
    localStorage.removeItem("aistudio.wizard");

    // Dialogs. Nothing above opens one -- a view "renders" perfectly while
    // every button in it throws -- and the benchmark dialog is drawn twice
    // from one function, once for a named benchmark and once for the whole
    // catalogue, which is exactly the shape that hides a missing null guard.
    const evalsBox = document.createElement("div");
    main.innerHTML = "";
    main.appendChild(evalsBox);
    const { evalsView } = await import("/static/js/views/evals.js");
    await evalsView(evalsBox);
    evalsBox.querySelector('[data-tab="benchmarks"]')?.click();
    await new Promise((r) => setTimeout(r, 400));

    const openDialog = async (selector) => {
      document.querySelectorAll("dialog").forEach((d) => d.remove());
      evalsBox.querySelector(selector)?.click();
      await new Promise((r) => setTimeout(r, 250));
      return document.querySelector("dialog");
    };
    const several = await openDialog("#runSeveral");
    say("the benchmark dialog opens for all of them",
        !!several && several.querySelectorAll("[data-bm-pick]").length >= 2
        && !!several.querySelector("#bmSample"),
        several ? `${several.querySelectorAll("[data-bm-pick]").length} to pick`
                : "no dialog");
    const one = await openDialog("[data-run-bm]");
    say("and for one of them",
        !!one && one.querySelectorAll("[data-bm-pick]:checked").length === 1,
        one ? one.querySelector("h2, .modal-title")?.textContent || "opened"
            : "no dialog");
    document.querySelectorAll("dialog").forEach((d) => d.remove());

    // The card editor: the form writes into the source, the preview renders
    // it, and the metadata that is generated rather than typed survives both.
    const cardBox = document.createElement("div");
    main.innerHTML = "";
    main.appendChild(cardBox);
    const { mountCardEditor } = await import("/static/js/views/cardeditor.js");
    mountCardEditor(cardBox, { jobId: "job_1" });
    await new Promise((r) => setTimeout(r, 400));
    const licence = cardBox.querySelector("#cardLicence");
    say("the card editor draws", !!licence && !!cardBox.querySelector("#cardText"),
        cardBox.textContent.replace(/\s+/g, " ").slice(0, 60));
    if (licence) {
      licence.value = "apache-2.0";
      licence.dispatchEvent(new Event("change", { bubbles: true }));
      await new Promise((r) => setTimeout(r, 150));
      const text = cardBox.querySelector("#cardText").value;
      say("a licence is written into the front matter",
          /license: apache-2\.0/.test(text), text.split("\n").slice(0, 3).join(" / "));
      say("and what was already there is kept",
          text.includes("base_model: HuggingFaceTB/SmolLM2-135M")
          && text.includes("- lora"));
      cardBox.querySelector('[data-card-tab="preview"]').click();
      await new Promise((r) => setTimeout(r, 150));
      const md = cardBox.querySelector(".md-preview");
      say("the preview renders the card",
          !!md && md.querySelector("table") && md.querySelector("pre.md-code")
          && !md.textContent.includes("library_name"),
          md ? md.textContent.replace(/\s+/g, " ").slice(0, 50) : "no preview");
    }

    // The graph tab has to draw, not merely leave a card behind. A view that
    // throws mid-render leaves whatever was there before -- which for this
    // one is the word "working" -- and every tab-switching check passes.
    const { projectView } = await import("/static/js/views/projects.js");
    // In a container of its own. Every view above was mounted into #main and
    // several of them are still holding promises that write to it when they
    // resolve; a page under test that another page can overwrite mid-check
    // measures the wrong thing.
    const box = document.createElement("div");
    main.innerHTML = "";
    main.appendChild(box);
    location.hash = "#/projects/prj_1";
    await projectView(box, ["prj_1"]);
    await new Promise((r) => setTimeout(r, 300));
    await new Promise((r) => setTimeout(r, 800));
    const strip = box.querySelectorAll(".g-strip .g-dot").length;
    say("the map carries a strip of it", strip >= 6, `${strip} dots`);
    box.querySelector('[data-tab="graph"]').click();
    await new Promise((r) => setTimeout(r, 500));
    const boxes = box.querySelectorAll(".g-node").length;
    const wires = box.querySelectorAll(".g-edge").length;
    say("graph draws", boxes >= 6 && wires >= 6,
        `${boxes} boxes, ${wires} edges, on the ${
          box.querySelector(".ribbon-tabs .on")?.dataset.tab} tab`);
    location.hash = "#/";

    // A run without a project cannot be started at all: the wizard asks
    // first, because a run nobody can find later is the thing projects exist
    // to prevent.
    localStorage.removeItem("aistudio.wizard");
    location.hash = "#/new";
    main.innerHTML = "";
    await wizardView(main, []);
    await new Promise((r) => setTimeout(r, 120));
    say("project asked first",
        !!main.querySelector("[data-pick-project]")
          && !main.querySelector("[data-mode]"),
        main.querySelector("h1")?.textContent || "no heading");
    location.hash = "#/new?project=prj_1";

    // An expired draft is not resumed.
    localStorage.setItem("aistudio.wizard",
      JSON.stringify({ at: Date.now() - 9 * 3600 * 1000, mode: "scratch" }));
    location.hash = "#/new?project=prj_1";
    main.innerHTML = "";
    await wizardView(main, []);
    await new Promise((r) => setTimeout(r, 120));
    const fresh = main.querySelector('[data-mode="finetune"]');
    say("stale draft dropped", fresh?.classList.contains("selected"),
        fresh ? fresh.className : "no mode button");
    localStorage.removeItem("aistudio.wizard");
  } catch (e) {
    results.push(`FAIL wizard-draft  ${e.message}`);
    errors.push("wizard-draft: " + (e.stack || e.message));
  }
}

// Let any late rejection land before reporting.
await new Promise((r) => setTimeout(r, 300));
const bad = results.filter((r) => !r.startsWith("ok")).length + errors.length;
document.getElementById("results").textContent =
  results.join("\n") + (errors.length ? "\n\nERRORS\n" + errors.join("\n") : "");
document.title = bad ? `FAILURES ${bad}` : "ALL VIEWS RENDER";
</script>
