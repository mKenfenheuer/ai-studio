# NVIDIA runner. Use alongside the main file:
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up -d
services:
  runner-cuda:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner.cuda
    image: ai-studio/runner:cuda
    restart: unless-stopped
    depends_on: [controller]
    volumes:
      - runner-cuda-data:/data
    environment:
      AI_STUDIO_CONTROLLER: http://controller:8420
      AI_STUDIO_JOIN_TOKEN: ${AI_STUDIO_JOIN_TOKEN}
      AI_STUDIO_RUNNER_NAME: ${AI_STUDIO_RUNNER_NAME:-nvidia-runner}
      # This machine's own cap on what the studio may have of its card, if
      # it is not the studio's to take in full -- a share of the memory, and
      # a share of the time. Unset means all of it. Left empty here rather
      # than defaulted, because an empty value reads as "no limit" too.
      AI_STUDIO_GPU_MEMORY_PCT: ${AI_STUDIO_GPU_MEMORY_PCT:-}
      AI_STUDIO_GPU_COMPUTE_PCT: ${AI_STUDIO_GPU_COMPUTE_PCT:-}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  runner-cuda-data:
